<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能股票数据仪表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .status-item .icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
        }

        .card h3 .icon {
            margin-right: 10px;
            font-size: 1.2em;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .stock-item:last-child {
            border-bottom: none;
        }

        .stock-info {
            flex: 1;
        }

        .stock-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }

        .stock-code {
            font-size: 0.9em;
            color: #666;
        }

        .stock-price {
            text-align: right;
        }

        .price {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .change {
            font-size: 0.9em;
        }

        .positive {
            color: #e74c3c;
        }

        .negative {
            color: #27ae60;
        }

        .neutral {
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #ffe6e6;
            color: #d63031;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .refresh-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .source-badge {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 5px;
        }

        .source-badge.chagubang_tcp {
            background: #e74c3c;
        }

        .source-badge.tencent_api {
            background: #27ae60;
        }

        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .token-item:last-child {
            border-bottom: none;
        }

        .token-info {
            flex: 1;
        }

        .token-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }

        .token-value {
            font-size: 0.9em;
            color: #666;
            font-family: monospace;
        }

        .token-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-indicator.active {
            background: #27ae60;
        }

        .status-indicator.inactive {
            background: #e74c3c;
        }

        .status-indicator.unknown {
            background: #f39c12;
        }

        .token-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 0.8em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-switch {
            background: #3498db;
            color: white;
        }

        .btn-switch:hover {
            background: #2980b9;
        }

        .btn-test {
            background: #f39c12;
            color: white;
        }

        .btn-test:hover {
            background: #e67e22;
        }

        .add-token-form {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .btn-add {
            background: #27ae60;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .btn-add:hover {
            background: #229954;
        }

        .toggle-form {
            background: #6c757d;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .toggle-form:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .status-bar {
                flex-direction: column;
                text-align: center;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 智能股票数据仪表板</h1>
            <p>混合数据源 · 实时更新 · 茶股帮TCP + 腾讯API</p>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-item">
                <span class="icon">🕐</span>
                <span id="currentTime">加载中...</span>
            </div>
            <div class="status-item">
                <span class="icon">📈</span>
                <span id="marketStatus">检查中...</span>
            </div>
            <div class="status-item">
                <span class="icon">🔗</span>
                <span id="dataSource">连接中...</span>
            </div>
            <div class="status-item">
                <button class="refresh-btn" onclick="refreshAll()">🔄 刷新数据</button>
            </div>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3><span class="icon">🏛️</span>主要指数</h3>
                <div id="indices">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h3><span class="icon">🔥</span>热门股票</h3>
                <div id="popularStocks">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h3><span class="icon">⚡</span>实时数据</h3>
                <div id="realtimeData">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h3><span class="icon">⚙️</span>系统状态</h3>
                <div id="systemStatus">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <div class="card">
                <h3><span class="icon">🔑</span>Token管理</h3>
                <div id="tokenManagement">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';
        const CLOUD_API_BASE = 'https://agent.aigupiao.me';
        
        // 更新当前时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }

        // 获取市场状态
        async function getMarketStatus() {
            try {
                const response = await fetch(`${API_BASE}/market/status`);
                const data = await response.json();
                
                const statusElement = document.getElementById('marketStatus');
                const sourceElement = document.getElementById('dataSource');
                
                statusElement.textContent = data.is_trading ? '交易中 🟢' : '休市中 🔴';
                sourceElement.textContent = `${data.data_source} (${data.connected_sources.join(', ')})`;
                
            } catch (error) {
                console.error('获取市场状态失败:', error);
                document.getElementById('marketStatus').textContent = '获取失败 ❌';
            }
        }

        // 获取热门股票
        async function getPopularStocks() {
            try {
                const response = await fetch(`${API_BASE}/stocks/popular`);
                const stocks = await response.json();
                
                const container = document.getElementById('popularStocks');
                container.innerHTML = '';
                
                stocks.forEach(stock => {
                    const stockElement = createStockElement(stock);
                    container.appendChild(stockElement);
                });
                
            } catch (error) {
                console.error('获取热门股票失败:', error);
                document.getElementById('popularStocks').innerHTML = '<div class="error">获取数据失败</div>';
            }
        }

        // 获取主要指数
        async function getIndices() {
            try {
                const indices = ['sh000001', 'sz399001', 'sz399006'];
                const response = await fetch(`${API_BASE}/stocks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(indices)
                });
                const stocks = await response.json();
                
                const container = document.getElementById('indices');
                container.innerHTML = '';
                
                stocks.forEach(stock => {
                    const stockElement = createStockElement(stock);
                    container.appendChild(stockElement);
                });
                
            } catch (error) {
                console.error('获取指数失败:', error);
                document.getElementById('indices').innerHTML = '<div class="error">获取数据失败</div>';
            }
        }

        // 获取实时数据
        async function getRealtimeData() {
            try {
                const response = await fetch(`${API_BASE}/stocks/realtime`);
                const data = await response.json();
                
                const container = document.getElementById('realtimeData');
                
                if (data.count === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #666;">暂无实时数据</div>';
                    return;
                }
                
                container.innerHTML = `<div style="margin-bottom: 10px; color: #666;">实时缓存: ${data.count} 只股票</div>`;
                
                data.data.forEach(stock => {
                    const stockElement = createSimpleStockElement(stock);
                    container.appendChild(stockElement);
                });
                
            } catch (error) {
                console.error('获取实时数据失败:', error);
                document.getElementById('realtimeData').innerHTML = '<div class="error">获取数据失败</div>';
            }
        }

        // 获取系统状态
        async function getSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/system/status`);
                const data = await response.json();
                
                const container = document.getElementById('systemStatus');
                container.innerHTML = `
                    <div style="margin-bottom: 10px;">
                        <strong>状态:</strong> ${data.status} ✅
                    </div>
                    <div style="margin-bottom: 10px;">
                        <strong>运行时间:</strong> ${data.uptime}
                    </div>
                    <div style="margin-bottom: 10px;">
                        <strong>缓存股票:</strong> ${data.cached_stocks} 只
                    </div>
                    <div style="margin-bottom: 10px;">
                        <strong>数据源状态:</strong>
                    </div>
                    <div style="margin-left: 20px;">
                        ${Object.entries(data.data_sources).map(([source, status]) => 
                            `<div>${source}: ${status} ${status === '可用' ? '✅' : '❌'}</div>`
                        ).join('')}
                    </div>
                    <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                        最后更新: ${data.last_update}
                    </div>
                `;
                
            } catch (error) {
                console.error('获取系统状态失败:', error);
                document.getElementById('systemStatus').innerHTML = '<div class="error">获取数据失败</div>';
            }
        }

        // 创建股票元素
        function createStockElement(stock) {
            const div = document.createElement('div');
            div.className = 'stock-item';
            
            const changeClass = stock.change > 0 ? 'positive' : stock.change < 0 ? 'negative' : 'neutral';
            const changeSymbol = stock.change > 0 ? '+' : '';
            
            div.innerHTML = `
                <div class="stock-info">
                    <div class="stock-name">${stock.name}</div>
                    <div class="stock-code">${stock.code}<span class="source-badge ${stock.source}">${stock.source}</span></div>
                </div>
                <div class="stock-price">
                    <div class="price">¥${stock.current_price.toFixed(2)}</div>
                    <div class="change ${changeClass}">
                        ${changeSymbol}${stock.change.toFixed(2)} (${changeSymbol}${stock.change_percent.toFixed(2)}%)
                    </div>
                </div>
            `;
            
            return div;
        }

        // 创建简单股票元素
        function createSimpleStockElement(stock) {
            const div = document.createElement('div');
            div.className = 'stock-item';
            
            const changeClass = stock.change_percent > 0 ? 'positive' : stock.change_percent < 0 ? 'negative' : 'neutral';
            const changeSymbol = stock.change_percent > 0 ? '+' : '';
            
            div.innerHTML = `
                <div class="stock-info">
                    <div class="stock-name">${stock.name}</div>
                    <div class="stock-code">${stock.code}<span class="source-badge ${stock.source}">${stock.source}</span></div>
                </div>
                <div class="stock-price">
                    <div class="price">¥${stock.current_price.toFixed(2)}</div>
                    <div class="change ${changeClass}">
                        ${changeSymbol}${stock.change_percent.toFixed(2)}%
                    </div>
                </div>
            `;
            
            return div;
        }

        // 获取Token管理信息
        async function getTokenManagement() {
            try {
                const response = await fetch(`${CLOUD_API_BASE}/tokens`);
                const data = await response.json();

                const container = document.getElementById('tokenManagement');

                if (data.success) {
                    let html = `
                        <div style="margin-bottom: 15px;">
                            <strong>当前活跃Token:</strong>
                            <span style="font-family: monospace; color: #27ae60;">
                                ${data.current_token ? data.current_token.substring(0, 15) + '...' : '未设置'}
                            </span>
                        </div>
                        <div style="margin-bottom: 15px;">
                            <strong>连接状态:</strong>
                            <span class="status-indicator ${data.connection_status === 'connected' ? 'active' : 'inactive'}"></span>
                            ${data.connection_status === 'connected' ? '已连接' : '未连接'}
                        </div>
                    `;

                    if (data.tokens && data.tokens.length > 0) {
                        html += '<div style="margin-bottom: 10px;"><strong>Token列表:</strong></div>';

                        data.tokens.forEach(token => {
                            const isActive = token.token === data.current_token;
                            html += `
                                <div class="token-item">
                                    <div class="token-info">
                                        <div class="token-name">${token.name || 'Token'}</div>
                                        <div class="token-value">${token.token.substring(0, 15)}...</div>
                                    </div>
                                    <div class="token-status">
                                        <span class="status-indicator ${isActive ? 'active' : 'inactive'}"></span>
                                        <div class="token-actions">
                                            ${!isActive ? `<button class="btn-small btn-switch" onclick="switchToken('${token.name}')">切换</button>` : '<span style="color: #27ae60; font-size: 0.8em;">当前</span>'}
                                            <button class="btn-small btn-test" onclick="testToken('${token.token}')">测试</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <div style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="toggle-form" onclick="toggleAddTokenForm()">+ 添加新Token</button>
                            <button class="btn-small btn-switch" onclick="syncToCloud()">同步到云端</button>
                            <button class="btn-small btn-test" onclick="syncFromCloud()">从云端同步</button>
                        </div>
                        <div id="addTokenForm" style="display: none;" class="add-token-form">
                            <div class="form-group">
                                <label>Token名称:</label>
                                <input type="text" id="newTokenName" placeholder="例如: backup_token_1">
                            </div>
                            <div class="form-group">
                                <label>Token值:</label>
                                <input type="text" id="newTokenValue" placeholder="QT_...">
                            </div>
                            <div class="form-group">
                                <label>优先级:</label>
                                <input type="number" id="newTokenPriority" value="5" min="1" max="10">
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <button class="btn-add" onclick="addNewToken()">添加到云端</button>
                                <button class="btn-add" onclick="updateLocalToken()">更新本地</button>
                            </div>
                        </div>
                    `;

                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div class="error">获取Token信息失败</div>';
                }

            } catch (error) {
                console.error('获取Token管理信息失败:', error);
                document.getElementById('tokenManagement').innerHTML = '<div class="error">连接云端服务失败</div>';
            }
        }

        // 切换Token
        async function switchToken(tokenName) {
            try {
                const response = await fetch(`${CLOUD_API_BASE}/switch-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token_name: tokenName
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✅ Token切换成功: ${result.message}`);
                    await getTokenManagement(); // 刷新Token状态
                } else {
                    alert(`❌ Token切换失败: ${result.message}`);
                }

            } catch (error) {
                console.error('切换Token失败:', error);
                alert('❌ 切换Token失败: 网络错误');
            }
        }

        // 测试Token
        async function testToken(token) {
            try {
                // 这里可以调用测试Token的API
                alert(`🔍 正在测试Token: ${token.substring(0, 15)}...\n\n请在交易时间内测试以获得准确结果。`);

            } catch (error) {
                console.error('测试Token失败:', error);
                alert('❌ 测试Token失败');
            }
        }

        // 显示/隐藏添加Token表单
        function toggleAddTokenForm() {
            const form = document.getElementById('addTokenForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        // 添加新Token到云端
        async function addNewToken() {
            const name = document.getElementById('newTokenName').value.trim();
            const token = document.getElementById('newTokenValue').value.trim();
            const priority = parseInt(document.getElementById('newTokenPriority').value);

            if (!name || !token) {
                alert('❌ 请填写Token名称和值');
                return;
            }

            if (!token.startsWith('QT_')) {
                alert('❌ Token格式错误，应该以QT_开头');
                return;
            }

            try {
                const response = await fetch(`${CLOUD_API_BASE}/tokens`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        name: name,
                        priority: priority
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✅ Token添加到云端成功: ${result.message}`);
                    clearTokenForm();
                    await getTokenManagement();
                } else {
                    alert(`❌ Token添加失败: ${result.message}`);
                }

            } catch (error) {
                console.error('添加Token失败:', error);
                alert('❌ 添加Token失败: 网络错误');
            }
        }

        // 更新本地Token
        async function updateLocalToken() {
            const token = document.getElementById('newTokenValue').value.trim();

            if (!token) {
                alert('❌ 请填写Token值');
                return;
            }

            if (!token.startsWith('QT_')) {
                alert('❌ Token格式错误，应该以QT_开头');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/token/update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`✅ 本地Token更新成功: ${result.message}`);
                    clearTokenForm();
                    await getTokenManagement();
                } else {
                    alert(`❌ 本地Token更新失败: ${result.message}`);
                }

            } catch (error) {
                console.error('更新本地Token失败:', error);
                alert('❌ 更新本地Token失败: 网络错误');
            }
        }

        // 同步Token到云端
        async function syncToCloud() {
            try {
                // 先获取本地当前Token
                const localResponse = await fetch(`${API_BASE}/token/current`);
                const localData = await localResponse.json();

                if (!localData.success || !localData.full_token) {
                    alert('❌ 获取本地Token失败');
                    return;
                }

                const token = localData.full_token;
                const tokenName = `local_sync_${Date.now()}`;

                // 添加到云端
                const addResponse = await fetch(`${CLOUD_API_BASE}/tokens`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        name: tokenName,
                        priority: 8
                    })
                });

                const addResult = await addResponse.json();

                if (addResult.success) {
                    // 切换到新Token
                    const switchResponse = await fetch(`${CLOUD_API_BASE}/switch-token`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token_name: tokenName
                        })
                    });

                    const switchResult = await switchResponse.json();

                    if (switchResult.success) {
                        alert(`✅ Token同步到云端成功: ${tokenName}`);
                        await getTokenManagement();
                    } else {
                        alert(`⚠️ Token已添加到云端，但切换失败: ${switchResult.message}`);
                    }
                } else {
                    alert(`❌ 同步到云端失败: ${addResult.message}`);
                }

            } catch (error) {
                console.error('同步到云端失败:', error);
                alert('❌ 同步到云端失败: 网络错误');
            }
        }

        // 从云端同步Token
        async function syncFromCloud() {
            try {
                // 获取云端当前Token
                const cloudResponse = await fetch(`${CLOUD_API_BASE}/tokens`);
                const cloudData = await cloudResponse.json();

                if (!cloudData.success || !cloudData.current_token) {
                    alert('❌ 获取云端Token失败');
                    return;
                }

                // 这里需要完整的Token，但云端API可能只返回部分Token
                // 实际实现中需要云端API支持返回完整Token
                alert('⚠️ 从云端同步功能需要云端API支持返回完整Token\n\n请手动复制云端Token并使用"更新本地"功能');

            } catch (error) {
                console.error('从云端同步失败:', error);
                alert('❌ 从云端同步失败: 网络错误');
            }
        }

        // 清空Token表单
        function clearTokenForm() {
            document.getElementById('newTokenName').value = '';
            document.getElementById('newTokenValue').value = '';
            document.getElementById('newTokenPriority').value = '5';
            document.getElementById('addTokenForm').style.display = 'none';
        }

        // 刷新所有数据
        async function refreshAll() {
            updateTime();
            await Promise.all([
                getMarketStatus(),
                getIndices(),
                getPopularStocks(),
                getRealtimeData(),
                getSystemStatus(),
                getTokenManagement()
            ]);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateTime();
            refreshAll();
            
            // 每30秒自动刷新
            setInterval(refreshAll, 30000);
            
            // 每秒更新时间
            setInterval(updateTime, 1000);
        });
    </script>
</body>
</html>
