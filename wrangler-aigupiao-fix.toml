name = "aigupiao-api-fix"
main = "aigupiao-api-fix-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 路由配置 - 修复aigupiao.me域名API问题
routes = [
    { pattern = "aigupiao.me/api/*", zone_name = "aigupiao.me" },
    { pattern = "aigupiao.me/health", zone_name = "aigupiao.me" },
    { pattern = "www.aigupiao.me/api/*", zone_name = "aigupiao.me" }
]

# 环境变量
[vars]
ENVIRONMENT = "production"
API_VERSION = "1.0"

# KV存储绑定（如果需要）
# [[kv_namespaces]]
# binding = "STOCK_CACHE"
# id = "your-kv-namespace-id"
