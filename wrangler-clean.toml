name = "ai-stock-trading-agent"
main = "cloudflare-worker-clean-deploy.js"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# 生产环境配置
[env.production]
name = "ai-stock-trading-agent"

# 环境变量
[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "AI Stock Trading Cloud Agent"
VERSION = "2.0.0"

# 自定义域名路由 - 使用已配置的域名
routes = [
  { pattern = "api.aigupiao.me/*", zone_name = "aigupiao.me" }
]
