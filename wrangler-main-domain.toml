name = "aigupiao-main-domain"
main = "main-domain-trading-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 路由配置 - 只处理主域名，避免冲突
routes = [
    { pattern = "aigupiao.me/*", zone_name = "aigupiao.me" },
    { pattern = "www.aigupiao.me/*", zone_name = "aigupiao.me" },
    { pattern = "agent.aigupiao.me/*", zone_name = "aigupiao.me" }
]

# 环境变量
[vars]
DOMAIN = "aigupiao.me"
ENVIRONMENT = "production"
API_VERSION = "5.0.0"
SUPABASE_URL = "https://zzukfxwavknskqcepsjb.supabase.co"
CHAGUBANG_HOST = "l1.chagubang.com"
CHAGUBANG_PORT = "6380"

# KV 存储配置（用于缓存）
[[kv_namespaces]]
binding = "STOCK_CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

# D1 数据库配置（可选，用于本地缓存）
[[d1_databases]]
binding = "DB"
database_name = "aigupiao-cache"
database_id = "your-d1-database-id"

# 限制配置
[limits]
cpu_ms = 50000

# 触发器配置（定时任务）
[[triggers.crons]]
cron = "*/30 * * * *"  # 每30分钟执行一次数据清理
