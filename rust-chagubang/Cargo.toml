[package]
name = "chagubang-rust"
version = "0.1.0"
edition = "2021"
authors = ["308186235@qq.com"]
description = "茶股帮实时股票数据系: 高性能与内存安全"

[dependencies]
# 异步编程 (实时多任务)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"

# Web API框架
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
hyper = "1.0"
tower-http = "0.5"

# Redis集成
redis = { version = "0.24", features = ["aio-compat", "tokio-comp"] }

# 日志和错误处理
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# 数据解析
bytes = "1.0"
futures = "0.3"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 环境变量
env = "0.21"

# 网络编程
reqwest = { version = "0.12", features = ["json"] }

# 时间处理
uuid = { version = "1.0", features = ["v$", "serde"] }

# 数据序列北
bincode = "1.3"

[[bin]]
name = "chagubang-server"
path = "src/main.rs"
